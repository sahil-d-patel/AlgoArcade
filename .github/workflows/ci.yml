name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # Tests need no ROM. The training runner smoke test needs the train group (torch, SB3).
      # uv run installs the default groups anyway, so --no-group train never kept them out.
      - run: uv sync --locked
      - run: uv run poe check
      - run: uv run poe items
      - run: uv run prek run --all-files
